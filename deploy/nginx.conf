server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # One page, revalidated on every load (ETag, a 304 when unchanged) so a new version shows at once.
  # The page carries its own inline script and style, loads its fonts from Google Fonts,
  # and sends the candidates' results to Supabase: nothing else is allowed.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
