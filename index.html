  function heal(i, amount) {
    const p = party[i];
    if (p.dead) return;
    const before = p.hp; p.hp = Math.min(100, p.hp + amount); healed += Math.round(p.hp - before);
  }
  frames.forEach((f, i) => f.addEventListener("click", () => {
    if (over || party[i].dead || mana < 8) { if (mana < 8 && !over) log("d", "Pas assez de mana. Bois de l'eau. En vrai."); return; }
    mana -= 8; heal(i, 30);
  }));
  $("#h-group", root).addEventListener("click", () => {
    if (over) return;
    if (mana < 25) { log("d", "Pas assez de mana pour le soin de groupe."); return; }
    mana -= 25; party.forEach((_, i) => heal(i, 15));
  });
  S.keyHandler = (e) => { const d = digitOf(e); if (d >= 1 && d <= 6) { e.preventDefault(); frames[d - 1].click(); } };

  const TICK = 100;
  every(() => {
    if (over) return;
    t += TICK / 1000;
    mana = Math.min(100, mana + 2.6 * TICK / 1000);
    party.forEach((p, i) => {
      if (p.dead) return;
      p.hp -= p.dps * (TICK / 1000) * rand(0.2, 1.8);
      if (p.hp <= 0) {
        p.hp = 0; p.dead = true;
        log("d", p.self ? "Tu es mort. Qui soigne le healer ? Personne." : `${p.n} est mort. ${pick(["Il accuse le heal.", "Il était dans le feu.", "Il demande un rez dans le chat.", "Il part chercher à manger."])}`);
      }
    });
    slamIn -= TICK / 1000;
    if (slamIn < 1.2 && !slamWarn && !party[0].dead) { slamWarn = true; frames[0].classList.add("slam"); log("y", "Le boss arme une Frappe Colossale sur Bouclierus !"); }
    if (slamIn <= 0) {
      slamWarn = false; frames[0].classList.remove("slam"); slamIn = rand(4.5, 6.5);
      if (!party[0].dead) { party[0].hp -= 38; if (party[0].hp <= 0) { party[0].hp = 0; party[0].dead = true; log("d", "Bouclierus est mort. Le boss cherche une nouvelle cible. Il te regarde."); } }
    }
    render();
    if (t >= DURATION || party[5].dead || party.every((p) => p.dead)) end();
  }, TICK);

  function render() {
    $("#h-t", root).textContent = Math.max(0, DURATION - t).toFixed(1).replace(".", ",");
    $("#h-m", root).textContent = Math.floor(mana);
    $("#h-mb", root).style.width = mana + "%";
    $("#h-h", root).textContent = healed;
    party.forEach((p, i) => {
      const f = frames[i];
      f.querySelector(".bar > i").style.width = p.hp + "%";
      f.classList.toggle("low", p.hp < 35 && !p.dead);
      f.classList.toggle("dead", p.dead);
      f.disabled = p.dead;
    });
  }
  render();

  function end() {
    if (over) return; over = true;
    const alive = party.filter((p) => !p.dead).length;
    const selfDead = party[5].dead, tankDead = party[0].dead;
    let bonus = alive >= 6 ? 3 : alive === 5 ? 2 : alive === 4 ? 1 : alive >= 2 ? 0 : -2;
    if (selfDead) bonus = Math.min(bonus, -1);
    const headline = selfDead ? "Le healer est tombé. Tout le monde a suivi."
      : alive === 6 ? "Personne n'est mort. Même pas Pyrolâtre."
      : alive >= 4 ? "Quelques pertes, mais le raid tient debout."
      : "C'est un cimetière, mais un cimetière bien soigné.";
    const lines = [
      ["y", `Survivants : ${alive} / 6`],
      ["s", `Points de vie rendus : ${healed}`],
      tankDead ? ["d", "Le tank est mort. Il en parlera pendant des semaines."] : ["s", "Le tank est vivant. Il ne te remerciera pas, c'est normal."],
      party[1].dead ? ["muted", "Pyrolâtre est mort dans le feu. Ce n'est pas de ta faute. Dis-le lui quand même."] : ["s", "Tu as gardé en vie quelqu'un qui ne le méritait pas. Respect."],
    ];
    clearIntervalsOnly();
    later(() => done({ bonus, headline, lines, summary: `Heal : ${alive}/6 survivants${tankDead ? " (tank mort)" : ""}` }), 700);
  }
}

/* ---------- TANK ---------- */
function tankGame(root, done) {
  const DURATION = 25;
  let t = 0, hp = 100, taunted = 0, leaked = 0, over = false, nextSpawn = 0.6, last = performance.now(), raf;
  const mobs = [];
  root.innerHTML = `
    <div class="hud"><span>Temps <b id="t-t">25,0</b> s</span><span>Provocations <b id="t-c">0</b></span><span>PV du healer <b id="t-hp">100</b></span></div>
    <div class="bar"><i id="t-hb" style="background:var(--hp)"></i></div>
    <div class="arena" id="arena"><div class="healer-pin"><span class="dot"></span><span>healer</span></div></div>
    <div class="log" id="t-log"><div class="muted">Le healer compte sur toi. Il a tort, mais il compte sur toi.</div></div>
  `;
  const arena = $("#arena", root), logEl = $("#t-log", root);
  const log = (cls, txt) => { logEl.insertAdjacentHTML("afterbegin", `<div class="${cls}">${esc(txt)}</div>`); while (logEl.children.length > 3) logEl.lastChild.remove(); };
  const pop = (x, y, txt) => { const p = document.createElement("div"); p.className = "pop"; p.style.left = x + "%"; p.style.top = y + "%"; p.textContent = txt; arena.appendChild(p); setTimeout(() => p.remove(), 700); };

  function spawn() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = rand(4, 96); y = 4; } else if (side === 1) { x = 96; y = rand(4, 96); }
    else if (side === 2) { x = rand(4, 96); y = 96; } else { x = 4; y = rand(4, 96); }
    const big = Math.random() < Math.min(0.35, 0.08 + t * 0.012);
    const el = document.createElement("button");
    el.type = "button"; el.className = "mob" + (big ? " big" : ""); el.textContent = big ? "☠" : "✦";
    el.setAttribute("aria-label", big ? "Gros monstre" : "Monstre");
    const m = { x, y, el, hits: big ? 2 : 1, speed: (big ? rand(9, 12) : rand(13, 19)) * (1 + t * 0.02) };
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); hitMob(m); });
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); hitMob(m); } });
    arena.appendChild(el); mobs.push(m); place(m);
  }
  function place(m) { m.el.style.left = m.x + "%"; m.el.style.top = m.y + "%"; }
  function hitMob(m) {
    if (over || !mobs.includes(m)) return;
    m.hits--;
    if (m.hits > 0) { pop(m.x, m.y, "Encore !"); m.el.style.opacity = .7; return; }
    taunted++; pop(m.x, m.y, pick(["Provoqué !", "Ici !", "Viens là !", "Regarde-moi !"]));
    remove(m);
  }
  function remove(m) { m.el.remove(); mobs.splice(mobs.indexOf(m), 1); }

  function frame(now) {
    if (over) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    nextSpawn -= dt;
    if (nextSpawn <= 0) { spawn(); nextSpawn = Math.max(0.42, 1.25 - t * 0.035) * rand(0.7, 1.3); }
    for (const m of [...mobs]) {
      const dx = 50 - m.x, dy = 50 - m.y, d = Math.hypot(dx, dy);
      if (d < 5) {
        hp -= m.el.classList.contains("big") ? 25 : 12; leaked++;
        arena.classList.remove("hit"); void arena.offsetWidth; arena.classList.add("hit");
        log("d", pick(["Le healer se fait taper. Il écrit déjà son message.", "Un monstre mord le healer. Le healer te regarde.", "« TANK ?! » — le healer", "Le healer court en rond. Ça n'aide pas."]));
        remove(m);
        continue;
      }
      m.x += (dx / d) * m.speed * dt; m.y += (dy / d) * m.speed * dt; place(m);
    }
    hp = Math.max(0, hp);
    $("#t-t", root).textContent = Math.max(0, DURATION - t).toFixed(1).replace(".", ",");
    $("#t-c", root).textContent = taunted;
    $("#t-hp", root).textContent = Math.round(hp);
    $("#t-hb", root).style.width = hp + "%";
    if (hp <= 0 || t >= DURATION) return end();
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame((n) => { last = n; frame(n); });

  function end() {
    over = true; cancelAnimationFrame(raf);
    mobs.forEach((m) => m.el.remove());
    const dead = hp <= 0;
    const bonus = dead ? -2 : hp >= 80 ? 3 : hp >= 50 ? 2 : hp >= 20 ? 1 : 0;
    const headline = dead ? "Le healer est mort. Il le savait. Il l'a toujours su."
      : hp >= 80 ? "Mur imprenable. Le healer a eu le temps de boire un thé."
      : hp >= 50 ? "Le healer est un peu cabossé, mais vivant."
      : "Le healer survit de justesse. Il te fera un retour constructif.";
    const lines = [
      ["y", `PV du healer à la fin : ${Math.round(hp)} / 100`],
      ["s", `Monstres provoqués : ${taunted}`],
      leaked ? ["d", `Monstres passés au travers : ${leaked}`] : ["s", "Aucun monstre n'a touché le healer. Il ne te croira jamais."],
    ];
    later(() => done({ bonus, headline, lines, summary: `Tank : healer à ${Math.round(hp)} PV, ${taunted} provocations, ${leaked} fuites` }), 600);
  }
}

/* ---------- DPS ---------- */
function dpsGame(root, done) {
  const DURATION = 20;
  const seq = Array.from({ length: 3 }, () => 1 + Math.floor(Math.random() * 4));
  let dmg = 0, combo = 0, maxCombo = 0, lives = 3, t = 0, over = false, fire = false, fireLeft = 0, nextFire = rand(2.5, 4.5);
  let dodges = 0, burns = 0, greedyHits = 0, misses = 0, dead = false;
  root.innerHTML = `
    <div class="hud"><span>Temps <b id="d-t">20,0</b> s</span><span>DPS <b id="d-dps">0</b></span><span>Combo <b id="d-c">0</b></span><span>Vie <span class="pips" id="d-l"><i></i><i></i><i></i></span></span></div>
    <div class="rota" id="rota">
      <div class="keys-next" id="keys"></div>
      <div class="fire-warn" id="fire" aria-live="assertive"></div>
    </div>
    <div class="pad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button><button type="button" data-k="4">4</button>
      <button type="button" class="dodge" data-k="dodge">Esquiver</button>
    </div>
    <div class="log" id="d-log"><div class="muted">Le boss attend. Les meters aussi.</div></div>
  `;
  const rota = $("#rota", root), logEl = $("#d-log", root);
  const log = (cls, txt) => { logEl.insertAdjacentHTML("afterbegin", `<div class="${cls}">${esc(txt)}</div>`); while (logEl.children.length > 3) logEl.lastChild.remove(); };
  function renderKeys() { $("#keys", root).innerHTML = seq.map((k, i) => `<span class="keycap ${i === 0 ? "now" : ""}">${k}</span>`).join(""); }
  function renderHud() {
    $("#d-t", root).textContent = Math.max(0, DURATION - t).toFixed(1).replace(".", ",");
    $("#d-dps", root).textContent = Math.round(dmg / Math.max(1, t)).toLocaleString("fr-FR");
    $("#d-c", root).textContent = combo;
    $("#d-l", root).innerHTML = [0, 1, 2].map((i) => `<i class="${i < lives ? "" : "off"}"></i>`).join("");
  }
  renderKeys(); renderHud();

  function press(k) {
    if (over || dead) return;
    if (k === "dodge") {
      if (fire) {
        fire = false; dodges++; nextFire = rand(2.2, 4);
        rota.classList.remove("fire"); rota.classList.add("dodged");
        $("#fire", root).textContent = "ESQUIVÉ !";
        later(() => { if (!fire && !dead) { rota.classList.remove("dodged"); $("#fire", root).textContent = ""; } }, 700);
        log("s", "Esquivé. Tu as un cerveau, et tu l'utilises."); combo = Math.max(0, combo - 2);
      }
      else log("muted", pick(["Tu sautes sans raison. Le style avant tout.", "Petite danse. Le boss est confus.", "Tu esquives… rien. Mais bien."]));
      return;
    }
    if (fire) greedyHits++;
    if (+k === seq[0]) {
      combo++; maxCombo = Math.max(maxCombo, combo);
      dmg += Math.round(900 * (1 + Math.min(combo, 25) * 0.08) * rand(0.9, 1.15));
      seq.shift(); seq.push(1 + Math.floor(Math.random() * 4)); renderKeys();
    } else {
      combo = 0; misses++;
      if (misses % 4 === 1) log("d", "Mauvaise touche. Combo perdu. Ta rotation ressemble à un solo de jazz.");
    }
    renderHud();
  }
  root.querySelectorAll(".pad button").forEach((b) => b.addEventListener("pointerdown", (e) => { e.preventDefault(); press(b.dataset.k); }));
  root.querySelectorAll(".pad button").forEach((b) => b.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); press(b.dataset.k); } }));
  S.keyHandler = (e) => {
    const d = digitOf(e);
    if (d >= 1 && d <= 4) { e.preventDefault(); press(String(d)); }
    else if (e.key === " " || e.code === "Space") { e.preventDefault(); press("dodge"); }
  };

  const TICK = 50;
  every(() => {
    if (over) return;
    t += TICK / 1000;
    if (!dead) {
      if (!fire) {
        nextFire -= TICK / 1000;
        if (nextFire <= 0) { fire = true; fireLeft = 1.4; rota.classList.remove("dodged"); rota.classList.add("fire"); $("#fire", root).textContent = "LE SOL BRÛLE ! Esquive [Espace]"; }
      } else {
        fireLeft -= TICK / 1000;
        if (fireLeft <= 0) {
          fire = false; rota.classList.remove("fire"); $("#fire", root).textContent = "";
          lives--; burns++; nextFire = rand(2.2, 4);
          if (lives <= 0) {
            dead = true; log("d", "Tu es mort dans le feu. Ton DPS était superbe, c'est ce qui compte. Non.");
            $("#fire", root).textContent = "MORT"; rota.classList.add("fire");
          } else log("d", pick(["Tu brûles. Le healer soupire.", "Aïe. Ça sent le cramé.", "Le feu fait mal. Qui l'eût cru ?"]));
        }
      }
      if (!fire && nextFire <= 0) nextFire = rand(2.2, 4);
    }
    if (!fire && !dead && nextFire > 4.5) nextFire = rand(2.2, 4);
    renderHud();
    if (t >= DURATION) end();
  }, TICK);

  function end() {
    over = true; clearIntervalsOnly();
    const dps = Math.round(dmg / Math.max(1, t));
    let bonus;
    if (dead) bonus = -1;
    else if (burns === 0 && dps >= 3500) bonus = 3;
    else if (burns <= 1) bonus = 2;
    else bonus = 1;
    const headline = dead ? "Meilleur DPS du cimetière."
      : burns === 0 ? "Gros chiffres, pieds au sec. Le DPS rêvé."
      : "Les meters sont contents. Le healer un peu moins.";
    const lines = [
      ["y", `DPS : ${dps.toLocaleString("fr-FR")} (combo max ${maxCombo})`],
      ["s", `Feux esquivés : ${dodges}`],
      burns ? ["d", `Brûlures : ${burns}${dead ? " (mort)" : ""}`] : ["s", "Aucune brûlure. Le healer t'envoie un cœur."],
      greedyHits > 3 ? ["muted", `Tu as continué à taper ${greedyHits} fois pendant que le sol brûlait. On a vu.`] : ["muted", "Tu as su lâcher la rotation pour bouger. C'est rare."],
    ];
    later(() => done({ bonus, headline, lines, summary: `DPS : ${dps.toLocaleString("fr-FR")} dps, ${burns} brûlure(s)${dead ? ", mort" : ""}` }), 500);
  }
}

/* ============ ÉPREUVES EN 3D (three.js) ============ */
const ARENA_R = 13;
const BOSS_NAME = "Grobular le Mal Réveillé";
function has3D() {
  if (!window.THREE) return false;
  try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch { return false; }
}
const mat3 = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.9, flatShading: true }, extra));
const flat3 = (color, extra) => new THREE.MeshBasicMaterial(Object.assign({ color }, extra));

function makeLabel(text, color = "#ece6d4") {
  const c = document.createElement("canvas"); c.width = 256; c.height = 64;
  const x = c.getContext("2d");
  x.font = "600 30px 'Alegreya Sans', 'Segoe UI', sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.lineWidth = 6; x.strokeStyle = "rgba(0,0,0,.85)"; x.strokeText(text, 128, 32, 248);
  x.fillStyle = color; x.fillText(text, 128, 32, 248);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
  s.scale.set(2.6, 0.65, 1); s.renderOrder = 5;
  return s;
}

// Personnage low-poly : corps, tête, accessoire de rôle, nom et barre de vie optionnels.
function makeFigure(color, opt = {}) {
  const T = THREE, g = new T.Group(), rig = new T.Group();
  rig.rotation.y = Math.PI; g.add(rig); // face au boss par défaut
  const body = new T.Mesh(new T.CylinderGeometry(0.32, 0.46, 1.1, 7), mat3(color)); body.position.y = 0.75;
  const head = new T.Mesh(new T.IcosahedronGeometry(0.3, 0), mat3(0xe6c7a0)); head.position.y = 1.6;
  rig.add(body, head);
  if (opt.kit === "tank") {
    const shield = new T.Mesh(new T.BoxGeometry(0.75, 0.95, 0.12), mat3(0x9aa3c2)); shield.position.set(-0.5, 0.9, 0.35); rig.add(shield);
    const pads = new T.Mesh(new T.BoxGeometry(1.05, 0.22, 0.5), mat3(0x9aa3c2)); pads.position.y = 1.28; rig.add(pads);
  } else if (opt.kit === "heal") {
    const staff = new T.Mesh(new T.CylinderGeometry(0.04, 0.04, 2, 5), mat3(0x8a6a3a)); staff.position.set(0.5, 1, 0); rig.add(staff);
    const orb = new T.Mesh(new T.IcosahedronGeometry(0.17, 0), flat3(0x7dffa8)); orb.position.set(0.5, 2.1, 0); rig.add(orb);
  } else if (opt.kit === "dps") {
    const sword = new T.Mesh(new T.BoxGeometry(0.09, 1.2, 0.09), mat3(0xd9deee)); sword.position.set(0.5, 1.05, 0.2); sword.rotation.x = 0.6; rig.add(sword);
  }
  let top = 2.15;
  if (opt.bar) {
    const bg = new T.Sprite(new T.SpriteMaterial({ color: 0x05060c, depthTest: false, transparent: true, opacity: 0.8 }));
    bg.scale.set(1.38, 0.2, 1); bg.position.y = top; bg.renderOrder = 6;
    const fg = new T.Sprite(new T.SpriteMaterial({ color: 0x3fbf6a, depthTest: false }));
    fg.center.set(0, 0.5); fg.position.set(-0.65, top, 0); fg.scale.set(1.3, 0.13, 1); fg.renderOrder = 7;
    g.add(bg, fg);
    g.userData.setHp = (r) => { fg.scale.x = Math.max(0.001, 1.3 * clamp(r, 0, 1)); fg.material.color.set(r < 0.35 ? 0xd8a636 : 0x3fbf6a); };
    g.userData.hideBar = () => { bg.visible = fg.visible = false; };
    top += 0.38;
  }
  if (opt.name) { const l = makeLabel(opt.name, opt.labelColor); l.position.y = top + 0.15; g.add(l); g.userData.label = l; }
  g.userData.body = body; g.userData.rig = rig;
  g.userData.fall = () => { rig.rotation.x = -Math.PI / 2; rig.position.y = 0.4; body.material.color.set(0x565b70); if (g.userData.hideBar) g.userData.hideBar(); };
  return g;
}

function makeBoss() {
  const T = THREE, g = new T.Group();
  const body = new T.Mesh(new T.DodecahedronGeometry(1.7, 0), mat3(0x5a2238)); body.position.y = 2.2; body.scale.set(1, 1.15, 0.9);
  const head = new T.Mesh(new T.DodecahedronGeometry(0.85, 0), mat3(0x6d2a42)); head.position.set(0, 4.3, 0.35);
  g.add(body, head);
  for (const s of [-1, 1]) {
    const eye = new T.Mesh(new T.SphereGeometry(0.13, 8, 6), flat3(0xffd23a)); eye.position.set(0.3 * s, 4.4, 1.08); g.add(eye);
    const horn = new T.Mesh(new T.ConeGeometry(0.22, 1.2, 5), mat3(0xd8cfa8)); horn.position.set(0.62 * s, 5.2, 0.2); horn.rotation.z = -0.5 * s; g.add(horn);
    const leg = new T.Mesh(new T.BoxGeometry(0.9, 1.1, 0.9), mat3(0x45192b)); leg.position.set(0.8 * s, 0.55, 0); g.add(leg);
    const pivot = new T.Group(); pivot.position.set(2.05 * s, 3.4, 0.2);
    const arm = new T.Mesh(new T.BoxGeometry(0.75, 2.4, 0.75), mat3(0x4a1c2e)); arm.position.y = -1.1; pivot.add(arm);
    const fist = new T.Mesh(new T.DodecahedronGeometry(0.6, 0), mat3(0x6d2a42)); fist.position.y = -2.4; pivot.add(fist);
    g.add(pivot);
    g.userData[s < 0 ? "armL" : "armR"] = pivot;
  }
  g.userData.body = body;
  return g;
}

function makeMob(big) {
  const T = THREE, g = new T.Group();
  const body = new T.Mesh(new T.ConeGeometry(0.48, 1.05, 6), mat3(big ? 0x7a1f3a : 0xb23a2e)); body.position.y = 0.52;
  const head = new T.Mesh(new T.IcosahedronGeometry(0.3, 0), mat3(big ? 0x99304d : 0xd8553f)); head.position.y = 1.18;
  g.add(body, head);
  for (const s of [-1, 1]) {
    const eye = new T.Mesh(new T.SphereGeometry(0.06, 6, 5), flat3(0xffe45a)); eye.position.set(0.12 * s, 1.22, 0.27); g.add(eye);
    if (big) { const horn = new T.Mesh(new T.ConeGeometry(0.09, 0.45, 4), mat3(0xd8cfa8)); horn.position.set(0.22 * s, 1.5, 0); horn.rotation.z = -0.4 * s; g.add(horn); }
  }
  // Zone de clic généreuse, invisible.
  const hitbox = new T.Mesh(new T.SphereGeometry(1.0, 8, 6), flat3(0xffffff, { transparent: true, opacity: 0, depthWrite: false })); hitbox.position.y = 0.8; g.add(hitbox);
  g.scale.setScalar(big ? 1.9 : 1.3);
  return g;
}

function makeFire(x, z, r) {
  const T = THREE, g = new T.Group(); g.position.set(x, 0, z);
  const disc = new T.Mesh(new T.CircleGeometry(r, 28), flat3(0xff5a1f, { transparent: true, opacity: 0.2, depthWrite: false })); disc.rotation.x = -Math.PI / 2; disc.position.y = 0.04;
  const ring = new T.Mesh(new T.RingGeometry(r - 0.14, r, 40), flat3(0xffc04a, { transparent: true, opacity: 0.95, depthWrite: false })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05;
  g.add(disc, ring);
  const flames = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2, d = r * (i % 2 ? 0.35 : 0.7);
    const f = new T.Mesh(new T.ConeGeometry(0.28, 1.1, 5), flat3(i % 2 ? 0xffc04a : 0xff7a2a, { transparent: true, opacity: 0.9 }));
    f.position.set(Math.cos(a) * d, 0.55, Math.sin(a) * d); f.visible = false; g.add(f); flames.push(f);
  }
  return { g, disc, ring, flames, x, z, r, t: 0, state: "warn" };
}

function makeArena(root, opt = {}) {
  const T = THREE;
  const wrap = document.createElement("div");
  wrap.className = "scene3d";
  wrap.innerHTML = `<div class="s3-top"></div><div class="s3-center"></div><div class="s3-fx"></div><div class="s3-left"></div>`;
  root.appendChild(wrap);
  const renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const canvas = renderer.domElement;
  wrap.prepend(canvas);

  const scene = new T.Scene();
  scene.background = new T.Color(0x0a0d1a);
  scene.fog = new T.Fog(0x0a0d1a, 26, 62);
  const camera = new T.PerspectiveCamera(48, 1.6, 0.1, 150);
  const camPos = new T.Vector3(...(opt.camPos || [0, 9, 16])), camLook = new T.Vector3(...(opt.camLook || [0, 1, 2]));
  camera.position.copy(camPos); camera.lookAt(camLook);
  function resize() {
    const w = wrap.clientWidth || 600, h = Math.round(clamp(w * 0.62, 250, 460));
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  resize(); window.addEventListener("resize", resize);

  scene.add(new T.HemisphereLight(0x9fb0ff, 0x2a1c12, 0.95));
  const sun = new T.DirectionalLight(0xffdca0, 0.95); sun.position.set(6, 12, 9); scene.add(sun);
  const glow = new T.PointLight(0xff5a2a, 1.3, 20); glow.position.set(0, 3.5, 2.5); scene.add(glow);

  const floor = new T.Mesh(new T.CircleGeometry(ARENA_R, 48), mat3(0x2a3050)); floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const outer = new T.Mesh(new T.RingGeometry(ARENA_R, ARENA_R + 9, 48), mat3(0x12162a)); outer.rotation.x = -Math.PI / 2; outer.position.y = -0.02; scene.add(outer);
  for (const [r, o] of [[ARENA_R - 0.35, 0.7], [9, 0.25], [3.4, 0.4]]) {
    const ring = new T.Mesh(new T.RingGeometry(r, r + 0.12, 72), flat3(0x9c7a35, { transparent: true, opacity: o })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.015; scene.add(ring);
  }
  for (let i = 0; i < 12; i++) { // rayons gravés au sol
    const a = (i / 12) * Math.PI * 2;
    const line = new T.Mesh(new T.PlaneGeometry(0.07, 5.2), flat3(0x9c7a35, { transparent: true, opacity: 0.22 }));
    line.rotation.x = -Math.PI / 2; line.rotation.z = -a; line.position.set(Math.sin(a) * 6.2, 0.012, Math.cos(a) * 6.2); scene.add(line);
  }
  for (let i = 0; i < 14; i++) { // piliers et torches, sauf devant la caméra
    const a = (i / 14) * Math.PI * 2, x = Math.cos(a) * (ARENA_R + 1.3), z = Math.sin(a) * (ARENA_R + 1.3);
    if (z > 5) continue;
    const h = 4.5 + (i % 3) * 0.9;
    const p = new T.Mesh(new T.CylinderGeometry(0.6, 0.8, h, 6), mat3(0x1d2340)); p.position.set(x, h / 2, z); scene.add(p);
    const torch = new T.Mesh(new T.IcosahedronGeometry(0.28, 0), flat3(0xffa040)); torch.position.set(x, h + 0.35, z); scene.add(torch);
  }
  const boss = makeBoss(); scene.add(boss);

  const fxEl = wrap.querySelector(".s3-fx"), v = new T.Vector3();
  function floatText(pos, text, cls = "") {
    v.set(pos.x, pos.y === undefined ? 1.8 : pos.y, pos.z).project(camera);
    const d = document.createElement("div"); d.className = "pop3 " + cls; d.textContent = text;
    d.style.left = (v.x * 0.5 + 0.5) * canvas.clientWidth + "px"; d.style.top = (-v.y * 0.5 + 0.5) * canvas.clientHeight + "px";
    fxEl.appendChild(d); setTimeout(() => d.remove(), 900);
  }
  function flash() { fxEl.classList.remove("hit"); void fxEl.offsetWidth; fxEl.classList.add("hit"); shake = 0.25; }

  const ray = new T.Raycaster(), ndc = new T.Vector2(), ground = new T.Plane(new T.Vector3(0, 1, 0), 0);
  function setRay(e) { const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
  function groundAt(e) { setRay(e); const p = new T.Vector3(); return ray.ray.intersectPlane(ground, p) ? p : null; }
  function pick(e, groups) {
    setRay(e);
    for (const hit of ray.intersectObjects(groups, true)) {
      let o = hit.object;
      while (o && o.userData.pick === undefined) o = o.parent;
      if (o) return o.userData.pick;
    }
    return null;
  }

  const frames = [];
  let raf = 0, last = performance.now(), running = true, shake = 0;
  function tick(now) {
    if (!running) return;
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!opt.follow) { camera.position.copy(camPos); }
    boss.userData.body.position.y = 2.2 + Math.sin(now / 420) * 0.07;
    for (const f of frames) f(dt, now / 1000);
    if (shake > 0) { shake -= dt; camera.position.x += rand(-0.09, 0.09); camera.position.y += rand(-0.09, 0.09); }
    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame((n) => { last = n; tick(n); });
  function stop() {
    if (!running) return;
    running = false; cancelAnimationFrame(raf); window.removeEventListener("resize", resize);
    renderer.dispose();
  }
  S.cleanups.push(stop);

  return {
    wrap, canvas, scene, camera, boss, floatText, flash, groundAt, pick,
    top: wrap.querySelector(".s3-top"), center: wrap.querySelector(".s3-center"), left: wrap.querySelector(".s3-left"),
    onFrame: (fn) => frames.push(fn),
  };
}

const fmtTime = (s) => Math.max(0, s).toFixed(1).replace(".", ",");
function logTo(el, max) {
  return (cls, txt) => { el.insertAdjacentHTML("afterbegin", `<div class="${cls}">${esc(txt)}</div>`); while (el.children.length > max) el.lastChild.remove(); };
}

/* ---------- DPS en 3D ---------- */
function dpsGame3D(root, done) {
  const T = THREE, DURATION = 25, RANGE = 7.5, SPEED = 6.5, BOSS_HP = 150000, WARN = 1.4, BURN = 3.5;
  const A = makeArena(root, { camPos: [0, 7.5, 15], camLook: [0, 1.2, 1], follow: true });
  A.top.innerHTML = `
    <div class="s3-boss"><span>${BOSS_NAME}</span><div class="bar"><i id="b-hp"></i></div></div>
    <div class="hud"><span>Temps <b id="d-t">25,0</b> s</span><span>DPS <b id="d-dps">0</b></span><span>Combo <b id="d-c">0</b></span><span>Vie <span class="pips" id="d-l"></span></span></div>`;
  const NAMES = ["Entaille", "Brûlure", "Éclair", "Gros coup"];
  root.insertAdjacentHTML("beforeend", `
    <div class="abar" id="abar">${NAMES.map((n, i) => `<button type="button" data-k="${i + 1}"><kbd>${i + 1}</kbd><span>${n}</span></button>`).join("")}</div>
    <p class="hint">Déplacement : <kbd>Z</kbd> <kbd>Q</kbd> <kbd>S</kbd> <kbd>D</kbd>, les flèches, ou un clic sur le sol. Reste dans l'anneau bleu pour toucher le boss, et sors des cercles de feu.</p>
    <div class="log" id="d-log"><div class="muted">Le boss te regarde. Les meters aussi.</div></div>`);
  const log = logTo($("#d-log", root), 3);

  const rangeRing = new T.Mesh(new T.RingGeometry(RANGE - 0.07, RANGE, 72), flat3(0x4a86e8, { transparent: true, opacity: 0.55 })); rangeRing.rotation.x = -Math.PI / 2; rangeRing.position.y = 0.02; A.scene.add(rangeRing);
  const player = makeFigure(0xe0ad4a, { kit: "dps", name: S.name, labelColor: "#e0ad4a" }); A.scene.add(player);
  const marker = new T.Mesh(new T.RingGeometry(0.25, 0.4, 20), flat3(0x7dffa8, { transparent: true, opacity: 0 })); marker.rotation.x = -Math.PI / 2; marker.position.y = 0.03; A.scene.add(marker);

  const rnd = () => 1 + Math.floor(Math.random() * 4);
  let seq = rnd(), px = 0, pz = 5.5, target = null;
  let dmg = 0, combo = 0, maxCombo = 0, lives = 3, t = 0, over = false, dead = false, deadAt = 0;
  let dodges = 0, burns = 0, greedyHits = 0, misses = 0, nextFire = 2.5, burnCd = 0.5, inWarn = false, rangeMsg = 0, killed = false;
  const keys = { up: false, down: false, left: false, right: false };
  const fires = [], shots = [];

  const bar = $("#abar", root);
  const renderBar = () => bar.querySelectorAll("button").forEach((b) => b.classList.toggle("now", +b.dataset.k === seq));
  renderBar();

  function press(k) {
    if (over || dead) return;
    if (Math.hypot(px, pz) > RANGE) {
      if (rangeMsg <= 0) { A.floatText({ x: px, z: pz, y: 2.6 }, "Hors de portée !", "hurt"); rangeMsg = 0.8; }
      return;
    }
    if (inWarn) greedyHits++;
    if (k === seq) {
      combo++; maxCombo = Math.max(maxCombo, combo);
      const hit = Math.round(900 * (1 + Math.min(combo, 25) * 0.08) * rand(0.9, 1.15));
      dmg += hit; seq = rnd(); renderBar();
      const m = new T.Mesh(new T.IcosahedronGeometry(0.2, 0), flat3([0xd9deee, 0xff7a2a, 0x8fd0ff, 0xe0ad4a][k - 1]));
      A.scene.add(m); shots.push({ m, t: 0, from: new T.Vector3(px, 1.3, pz), hit });
    } else {
      combo = 0; misses++;
      if (misses % 4 === 1) log("d", "Mauvaise touche. Combo perdu. Ta rotation ressemble à un solo de jazz.");
    }
  }
  bar.querySelectorAll("button").forEach((b) => b.addEventListener("pointerdown", (e) => { e.preventDefault(); press(+b.dataset.k); }));

  const MOVE = { KeyW: "up", ArrowUp: "up", KeyS: "down", ArrowDown: "down", KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right" };
  const onDown = (e) => {
    if (e.target.matches && e.target.matches("input[type=text], textarea")) return;
    if (MOVE[e.code]) { keys[MOVE[e.code]] = true; e.preventDefault(); return; }
    if (e.repeat) return;
    const d = digitOf(e);
    if (d >= 1 && d <= 4) { e.preventDefault(); press(d); }
  };
  const onUp = (e) => { if (MOVE[e.code]) keys[MOVE[e.code]] = false; };
  const onBlur = () => { keys.up = keys.down = keys.left = keys.right = false; };
  window.addEventListener("keydown", onDown); window.addEventListener("keyup", onUp); window.addEventListener("blur", onBlur);
  S.cleanups.push(() => { window.removeEventListener("keydown", onDown); window.removeEventListener("keyup", onUp); window.removeEventListener("blur", onBlur); });
  A.canvas.addEventListener("pointerdown", (e) => {
    if (over || dead) return;
    const p = A.groundAt(e); if (!p) return;
    const l = Math.hypot(p.x, p.z), m = ARENA_R - 0.7;
    if (l > m) { p.x *= m / l; p.z *= m / l; }
    target = p; marker.position.set(p.x, 0.03, p.z); marker.material.opacity = 0.9;
  });

  function burn(msg) {
    lives--; burns++; burnCd = 1.5; A.flash();
    A.floatText({ x: px, z: pz, y: 2.4 }, "Aïe !", "hurt");
    if (lives <= 0) {
      dead = true; deadAt = t; player.userData.fall();
      log("d", "Tu es mort dans le feu. Ton DPS était superbe, c'est ce qui compte. Non.");
    } else log("d", msg || pick(["Tu brûles. Le healer soupire.", "Ça sent le cramé.", "Le feu fait mal. Qui l'eût cru ?"]));
  }

  A.onFrame((dt, now) => {
    if (over) return;
    t += dt; rangeMsg -= dt;

    if (!dead) {
      const mx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), mz = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      let moving = false;
      if (mx || mz) { const l = Math.hypot(mx, mz); px += (mx / l) * SPEED * dt; pz += (mz / l) * SPEED * dt; target = null; moving = true; player.userData.rig.rotation.y = Math.atan2(mx, mz); }
      else if (target) {
        const dx = target.x - px, dz = target.z - pz, d = Math.hypot(dx, dz);
        if (d < 0.15) target = null;
        else { const s = Math.min(d, SPEED * dt); px += (dx / d) * s; pz += (dz / d) * s; moving = true; player.userData.rig.rotation.y = Math.atan2(dx, dz); }
      }
      let l = Math.hypot(px, pz);
      if (l > ARENA_R - 0.7) { px *= (ARENA_R - 0.7) / l; pz *= (ARENA_R - 0.7) / l; }
      if (l < 3) { if (l < 0.01) { pz = 3; } else { px *= 3 / l; pz *= 3 / l; } }
      if (!moving) player.userData.rig.rotation.y = Math.atan2(-px, -pz);
      player.position.set(px, moving ? Math.abs(Math.sin(now * 12)) * 0.12 : 0, pz);
    }
    marker.material.opacity = Math.max(0, marker.material.opacity - dt * 1.5);
    const outOfRange = !dead && Math.hypot(px, pz) > RANGE;
    bar.classList.toggle("oor", outOfRange);
    rangeRing.material.color.set(outOfRange ? 0xe2583f : 0x4a86e8);

    nextFire -= dt;
    if (!dead && nextFire <= 0) {
      const f = makeFire(px, pz, 2.3 + Math.min(0.9, t * 0.03)); A.scene.add(f.g); fires.push(f);
      nextFire = rand(2.3, 3.6) * Math.max(0.65, 1 - t * 0.012);
    }
    inWarn = false; let inBurn = false;
    for (const f of [...fires]) {
      f.t += dt;
      const inside = Math.hypot(px - f.x, pz - f.z) < f.r;
      if (f.state === "warn") {
        const k = Math.min(1, f.t / WARN);
        f.disc.scale.setScalar(Math.max(0.05, k)); f.disc.material.opacity = 0.2 + 0.3 * k;
        if (inside) inWarn = true;
        if (f.t >= WARN) {
          f.state = "burn"; f.t = 0; f.disc.scale.setScalar(1); f.flames.forEach((m) => (m.visible = true));
          if (!dead) { if (inside) burn("Tu es resté dans le cercle. Le healer a tout vu."); else { dodges++; } }
        }
      } else {
        f.disc.material.opacity = 0.55 + Math.sin(now * 14 + f.x) * 0.12;
        f.flames.forEach((m, i) => { m.scale.y = 0.8 + Math.sin(now * 9 + i * 2) * 0.35; });
        if (inside) inBurn = true;
        if (f.t > BURN) { A.scene.remove(f.g); fires.splice(fires.indexOf(f), 1); }
      }
    }
    if (inBurn && !dead) { burnCd -= dt; if (burnCd <= 0) burn(); } else if (!inBurn) burnCd = 0.5;
    A.center.textContent = dead ? "MORT" : inWarn ? "SORS DU FEU !" : inBurn ? "ÇA BRÛLE !" : "";

    for (const s of [...shots]) {
      s.t += dt / 0.22;
      s.m.position.set(s.from.x * (1 - s.t), 1.3 + 1.4 * s.t, s.from.z * (1 - s.t));
      if (s.t >= 1) { A.scene.remove(s.m); shots.splice(shots.indexOf(s), 1); A.floatText({ x: rand(-1, 1), y: rand(3.6, 5), z: 0.8 }, s.hit.toLocaleString("fr-FR")); }
    }
    A.boss.rotation.y = Math.atan2(px, pz);
    A.boss.userData.armR.rotation.x = -0.5 + Math.sin(now * 3) * 0.4;
    A.boss.userData.armL.rotation.x = -0.5 + Math.cos(now * 3) * 0.4;

    A.camera.position.lerp(new T.Vector3(px * 0.75, 7.5, pz + 9.5), 1 - Math.exp(-dt * 5));
    A.camera.lookAt(px * 0.5, 1.2, pz * 0.4 - 0.6);

    $("#d-t", root).textContent = fmtTime(DURATION - t);
    $("#d-dps", root).textContent = Math.round(dmg / Math.max(1, t)).toLocaleString("fr-FR");
    $("#d-c", root).textContent = combo;
    $("#d-l", root).innerHTML = [0, 1, 2].map((i) => `<i class="${i < lives ? "" : "off"}"></i>`).join("");
    $("#b-hp", root).style.width = Math.max(0, 100 - (dmg / BOSS_HP) * 100) + "%";

    if (dmg >= BOSS_HP) { killed = true; end(); }
    else if (t >= DURATION || (dead && t - deadAt > 1.6)) end();
  });

  function end() {
    over = true;
    const dps = Math.round(dmg / Math.max(1, t)), left = Math.max(0, Math.round(100 - (dmg / BOSS_HP) * 100));
    let bonus;
    if (dead) bonus = -1;
    else if (killed || (burns === 0 && dps >= 3500)) bonus = 3;
    else if (burns <= 1) bonus = 2;
    else bonus = 1;
    const headline = dead ? "Meilleur DPS du cimetière."
      : killed ? "Tu as tué le boss tout seul. Le raid se demande à quoi il sert."
      : burns === 0 ? "Gros chiffres, pieds au sec. Le DPS rêvé."
      : "Les meters sont contents. Le healer un peu moins.";
    const lines = [
      ["y", `DPS : ${dps.toLocaleString("fr-FR")} (combo max ${maxCombo}) · boss à ${left} %`],
      ["s", `Cercles de feu esquivés : ${dodges}`],
      burns ? ["d", `Brûlures : ${burns}${dead ? " (mort)" : ""}`] : ["s", "Aucune brûlure. Le healer t'envoie un cœur."],
      greedyHits > 3 ? ["muted", `Tu as lancé ${greedyHits} attaques les pieds dans un cercle qui allait s'embraser. On a vu.`] : ["muted", "Tu as bougé avant de taper. C'est rare."],
    ];
    later(() => done({ bonus, headline, lines, summary: `DPS : ${dps.toLocaleString("fr-FR")} dps, ${burns} brûlure(s)${dead ? ", mort" : ""}${killed ? ", boss tué" : ""}` }), 900);
  }
}

/* ---------- TANK en 3D ---------- */
function tankGame3D(root, done) {
  const DURATION = 25, HEALER = { x: 0, z: 7.2 }, TANK = { x: 0, z: 3 };
  const A = makeArena(root, { camPos: [0, 11.5, 13.2], camLook: [0, 0, 3.2] });
  A.canvas.style.cursor = "crosshair";
  A.top.innerHTML = `<div class="hud"><span>Temps <b id="t-t">25,0</b> s</span><span>Provocations <b id="t-c">0</b></span><span>PV du healer <b id="t-hp">100</b></span></div>`;
  root.insertAdjacentHTML("beforeend", `
    <div class="btn-row" style="align-items:center"><button class="btn ghost" type="button" id="t-taunt">Provocation <kbd>1</kbd></button>
      <p class="hint">Clique sur les monstres pour les attirer sur toi. <kbd>1</kbd> ou <kbd>Espace</kbd> provoque le plus proche du healer (1 s de recharge).</p></div>
    <div class="log" id="t-log"><div class="muted">Le healer compte sur toi. Il a tort, mais il compte sur toi.</div></div>`);
  const log = logTo($("#t-log", root), 3);

  const tank = makeFigure(0x4f7fd6, { kit: "tank", name: S.name, labelColor: "#e0ad4a" }); tank.position.set(TANK.x, 0, TANK.z); A.scene.add(tank);
  const healer = makeFigure(0x4fc47a, { kit: "heal", name: "Soignou", bar: true }); healer.position.set(HEALER.x, 0, HEALER.z); A.scene.add(healer);

  let t = 0, hp = 100, taunted = 0, leaked = 0, over = false, nextSpawn = 0.6, cd = 0;
  const mobs = [];

  function spawn() {
    let a, x, z;
    do { a = rand(0, Math.PI * 2); x = Math.cos(a) * 10.2; z = Math.sin(a) * 10.2; } while (Math.hypot(x - HEALER.x, z - HEALER.z) < 6.5 || z > 9);
    const big = Math.random() < Math.min(0.35, 0.08 + t * 0.012);
    const m = { g: makeMob(big), x, z, big, hits: big ? 2 : 1, state: "run", speed: (big ? rand(2.3, 3) : rand(3.3, 4.6)) * (1 + t * 0.02), slot: rand(0, Math.PI * 2), t: 0, ph: rand(0, 6) };
    m.g.userData.pick = m; m.g.position.set(x, 0, z); A.scene.add(m.g); mobs.push(m);
  }
  function hit(m) {
    if (over || m.state !== "run") return;
    m.hits--;
    if (m.hits > 0) { A.floatText({ x: m.x, z: m.z, y: 2.8 }, "Encore !"); return; }
    m.state = "taunted"; taunted++;
    A.floatText({ x: m.x, z: m.z, y: m.big ? 2.8 : 2 }, pick(["Provoqué !", "Ici !", "Viens là !", "Regarde-moi !"]));
  }
  A.canvas.addEventListener("pointerdown", (e) => {
    const m = A.pick(e, mobs.filter((m) => m.state === "run").map((m) => m.g));
    if (m) { e.preventDefault(); hit(m); }
  });
  function keyTaunt() {
    if (over || cd > 0) return;
    const run = mobs.filter((m) => m.state === "run");
    if (!run.length) return;
    run.sort((a, b) => Math.hypot(a.x - HEALER.x, a.z - HEALER.z) - Math.hypot(b.x - HEALER.x, b.z - HEALER.z));
    cd = 1; hit(run[0]);
  }
  $("#t-taunt", root).addEventListener("click", keyTaunt);
  S.keyHandler = (e) => { if (digitOf(e) === 1 || e.code === "Space") { e.preventDefault(); if (!e.repeat) keyTaunt(); } };

  A.onFrame((dt, now) => {
    if (over) return;
    t += dt; cd -= dt;
    $("#t-taunt", root).disabled = cd > 0;
    nextSpawn -= dt;
    if (nextSpawn <= 0) { spawn(); nextSpawn = Math.max(0.45, 1.3 - t * 0.035) * rand(0.7, 1.3); }
    let held = 0;
    for (const m of [...mobs]) {
      const tx = m.state === "run" ? HEALER.x : TANK.x + Math.cos(m.slot) * 1.5, tz = m.state === "run" ? HEALER.z : TANK.z + Math.sin(m.slot) * 1.5;
      const dx = tx - m.x, dz = tz - m.z, d = Math.hypot(dx, dz);
      if (m.state === "run" && d < 0.9) {
        hp -= m.big ? 25 : 12; leaked++; A.flash();
        A.floatText({ x: HEALER.x, z: HEALER.z, y: 2.6 }, m.big ? "-25" : "-12", "hurt");
        log("d", pick(["Le healer se fait taper. Il écrit déjà son message.", "Un monstre mord le healer. Le healer te regarde.", "« TANK ?! » — le healer", "Le healer court en rond. Ça n'aide pas."]));
        A.scene.remove(m.g); mobs.splice(mobs.indexOf(m), 1); continue;
      }
      if (m.state === "held") {
        held++; m.t += dt;
        m.g.position.y = Math.abs(Math.sin(now * 8 + m.ph)) * 0.2;
        if (m.t > 2) { m.state = "dying"; m.t = 0; }
      } else if (m.state === "dying") {
        m.t += dt; m.g.scale.multiplyScalar(Math.max(0, 1 - dt * 6));
        if (m.t > 0.4) { A.scene.remove(m.g); mobs.splice(mobs.indexOf(m), 1); }
      } else if (d > 0.12) {
        const s = Math.min(d, (m.state === "taunted" ? 9 : m.speed) * dt);
        m.x += (dx / d) * s; m.z += (dz / d) * s;
        m.g.position.set(m.x, Math.abs(Math.sin(now * 10 + m.ph)) * 0.15, m.z); m.g.rotation.y = Math.atan2(dx, dz);
      } else if (m.state === "taunted") { m.state = "held"; m.t = 0; m.g.rotation.y = Math.atan2(TANK.x - m.x, TANK.z - m.z); }
    }
    tank.userData.rig.rotation.y = held ? tank.userData.rig.rotation.y + dt * 9 : Math.PI;
    healer.position.x = HEALER.x + (hp < 60 ? Math.sin(now * 14) * 0.08 : 0);
    A.boss.userData.armR.rotation.x = -0.6 + Math.sin(now * 4) * 0.5;
    hp = Math.max(0, hp);
    healer.userData.setHp(hp / 100);
    $("#t-t", root).textContent = fmtTime(DURATION - t);
    $("#t-c", root).textContent = taunted;
    $("#t-hp", root).textContent = Math.round(hp);
    if (hp <= 0 || t >= DURATION) end();
  });

  function end() {
    over = true;
    const dead = hp <= 0;
    if (dead) { healer.userData.fall(); A.center.textContent = "HEALER MORT"; }
    const bonus = dead ? -2 : hp >= 80 ? 3 : hp >= 50 ? 2 : hp >= 20 ? 1 : 0;
    const headline = dead ? "Le healer est mort. Il le savait. Il l'a toujours su."
      : hp >= 80 ? "Mur imprenable. Le healer a eu le temps de boire un thé."
      : hp >= 50 ? "Le healer est un peu cabossé, mais vivant."
      : "Le healer survit de justesse. Il te fera un retour constructif.";
    const lines = [
      ["y", `PV du healer à la fin : ${Math.round(hp)} / 100`],
      ["s", `Monstres provoqués : ${taunted}`],
      leaked ? ["d", `Monstres passés au travers : ${leaked}`] : ["s", "Aucun monstre n'a touché le healer. Il ne te croira jamais."],
    ];
    later(() => done({ bonus, headline, lines, summary: `Tank : healer à ${Math.round(hp)} PV, ${taunted} provocations, ${leaked} fuites` }), 900);
  }
}

/* ---------- HEAL en 3D ---------- */
function healGame3D(root, done) {
  const T = THREE, DURATION = 25;
  const shift = window.innerWidth > 620 ? -2.3 : 0; // laisse la place aux cadres de raid à gauche
  const A = makeArena(root, { camPos: [shift, 9.5, 17], camLook: [shift, 1, 3.2] });
  const party = [
    { n: "Bouclierus", r: "Tank", kit: "tank", col: 0x4f7fd6, dps: 9, pos: [0, 3] },
    { n: "Pyrolâtre", r: "DPS", kit: "dps", col: 0xd6734f, dps: 7, pos: [-3.6, 3.8], note: "dans le feu" },
    { n: "Kevinator", r: "DPS", kit: "dps", col: 0xc9a14f, dps: 3.5, pos: [3.6, 3.8] },
    { n: "Flèchemolle", r: "DPS", kit: "dps", col: 0x8fb84f, dps: 2, pos: [-5.6, 6.8] },
    { n: "Dotdotdot", r: "DPS", kit: "dps", col: 0x9a6fd6, dps: 2, pos: [5.6, 6.8], note: "AFK" },
    { n: S.name, r: "Heal", kit: "heal", col: 0x4fc47a, dps: 1.6, pos: [0, 9], self: true },
  ].map((p) => ({ ...p, hp: 100, dead: false }));
  party.forEach((p) => {
    p.g = makeFigure(p.col, { kit: p.kit, name: p.n, bar: true, labelColor: p.self ? "#e0ad4a" : undefined });
    p.g.position.set(p.pos[0], 0, p.pos[1]); p.g.userData.pick = p; A.scene.add(p.g);
  });
  const fire = makeFire(party[1].pos[0], party[1].pos[1], 1.5); fire.state = "burn"; fire.disc.material.opacity = 0.6; fire.flames.forEach((m) => (m.visible = true)); A.scene.add(fire.g);

  A.top.innerHTML = `
    <div class="s3-boss"><span>${BOSS_NAME}</span><div class="bar"><i style="width:100%"></i></div></div>
    <div class="hud"><span>Temps <b id="h-t">25,0</b> s</span><span>Mana <b id="h-m">100</b></span><span>Soins <b id="h-h">0</b></span></div>`;
  A.left.innerHTML = party.map((p, i) => `<button class="frame" type="button" id="hf-${i}" data-i="${i}">
      <span class="nm"><span>${esc(p.n)}</span><em>${i + 1}</em></span><span class="bar"><i></i></span></button>`).join("");
  root.insertAdjacentHTML("beforeend", `
    <div class="bar mana"><i id="h-mb"></i></div>
    <div class="btn-row" style="align-items:center"><button class="btn ghost" type="button" id="h-group">Soin de groupe (25 mana) <kbd>Espace</kbd></button>
      <p class="hint">Clique sur un cadre ou sur un personnage pour le soigner (8 mana). Touches <kbd>1</kbd> à <kbd>6</kbd>.</p></div>
    <div class="log" id="h-log"><div class="muted">Le combat commence.</div></div>`);
  const log = logTo($("#h-log", root), 4);
  const frames = party.map((_, i) => $("#hf-" + i, root));
  const me = party[5];
  let mana = 100, t = 0, slamIn = rand(4, 6), slamWarn = false, over = false, healed = 0, armTarget = -0.4;
  const beams = [];

  function heal(i, amount) {
    const p = party[i];
    if (p.dead) return;
    const before = p.hp; p.hp = Math.min(100, p.hp + amount); healed += Math.round(p.hp - before);
    const pts = [new T.Vector3(me.pos[0] + 0.5, 2.1, me.pos[1]), new T.Vector3(p.pos[0], 1.2, p.pos[1])];
    const line = new T.Line(new T.BufferGeometry().setFromPoints(pts), new T.LineBasicMaterial({ color: 0x7dffa8, transparent: true }));
    A.scene.add(line); beams.push({ line, t: 0 });
    A.floatText({ x: p.pos[0], z: p.pos[1], y: 2.9 }, "+" + amount, "heal");
  }
  function single(i) {
    if (over || party[i].dead) return;
    if (mana < 8) { log("d", "Pas assez de mana. Bois de l'eau. En vrai."); return; }
    mana -= 8; heal(i, 30);
  }
  function group() {
    if (over) return;
    if (mana < 25) { log("d", "Pas assez de mana pour le soin de groupe."); return; }
    mana -= 25; party.forEach((_, i) => heal(i, 15));
  }
  frames.forEach((f, i) => f.addEventListener("click", () => single(i)));
  $("#h-group", root).addEventListener("click", group);
  A.canvas.addEventListener("pointerdown", (e) => { const p = A.pick(e, party.filter((p) => !p.dead).map((p) => p.g)); if (p) single(party.indexOf(p)); });
  S.keyHandler = (e) => {
    const d = digitOf(e);
    if (d >= 1 && d <= 6) { e.preventDefault(); single(d - 1); }
    else if (e.code === "Space") { e.preventDefault(); if (!e.repeat) group(); }
  };

  function kill(p, msg) { p.hp = 0; p.dead = true; p.g.userData.fall(); log("d", msg); }

  A.onFrame((dt, now) => {
    for (const b of [...beams]) { b.t += dt; b.line.material.opacity = Math.max(0, 1 - b.t / 0.3); if (b.t > 0.3) { A.scene.remove(b.line); beams.splice(beams.indexOf(b), 1); } }
    fire.disc.material.opacity = 0.55 + Math.sin(now * 14) * 0.12;
    fire.flames.forEach((m, i) => { m.scale.y = 0.8 + Math.sin(now * 9 + i * 2) * 0.35; });
    const arm = A.boss.userData.armR; arm.rotation.x += (armTarget - arm.rotation.x) * Math.min(1, dt * 12);
    A.boss.userData.armL.rotation.x = -0.7 + Math.sin(now * 5) * 0.45;
    if (over) return;
    t += dt;
    mana = Math.min(100, mana + 2.6 * dt);
    party.forEach((p) => {
      if (p.dead) return;
      p.hp -= p.dps * dt * rand(0.2, 1.8);
      if (p.hp <= 0) kill(p, p.self ? "Tu es mort. Qui soigne le healer ? Personne." : `${p.n} est mort. ${pick(["Il accuse le heal.", "Il était dans le feu.", "Il demande un rez dans le chat.", "Il part chercher à manger."])}`);
      else if (!p.self && p.kit === "dps") p.g.userData.rig.rotation.y = Math.PI + Math.sin(now * 6 + p.pos[0]) * 0.5;
    });
    slamIn -= dt;
    if (slamIn < 1.2 && !slamWarn && !party[0].dead) { slamWarn = true; armTarget = -2.6; frames[0].classList.add("slam"); A.center.textContent = "Frappe Colossale !"; log("y", "Le boss arme une Frappe Colossale sur Bouclierus !"); }
    if (slamIn <= 0) {
      slamWarn = false; armTarget = -0.4; frames[0].classList.remove("slam"); A.center.textContent = ""; slamIn = rand(4.5, 6.5);
      if (!party[0].dead) {
        party[0].hp -= 38; A.flash(); A.floatText({ x: 0, z: 3, y: 2.9 }, "-38", "hurt");
        if (party[0].hp <= 0) kill(party[0], "Bouclierus est mort. Le boss cherche une nouvelle cible. Il te regarde.");
      }
    }
    $("#h-t", root).textContent = fmtTime(DURATION - t);
    $("#h-m", root).textContent = Math.floor(mana);
    $("#h-mb", root).style.width = mana + "%";
    $("#h-h", root).textContent = healed;
    party.forEach((p, i) => {
      const f = frames[i];
      f.querySelector(".bar > i").style.width = p.hp + "%";
      f.classList.toggle("low", p.hp < 35 && !p.dead); f.classList.toggle("dead", p.dead); f.disabled = p.dead;
      p.g.userData.setHp(p.hp / 100);
    });
    if (t >= DURATION || me.dead || party.every((p) => p.dead)) end();
  });

  function end() {
    over = true; A.center.textContent = ""; armTarget = -0.4;
    const alive = party.filter((p) => !p.dead).length, selfDead = me.dead, tankDead = party[0].dead;
    let bonus = alive >= 6 ? 3 : alive === 5 ? 2 : alive === 4 ? 1 : alive >= 2 ? 0 : -2;
    if (selfDead) bonus = Math.min(bonus, -1);
    const headline = selfDead ? "Le healer est tombé. Tout le monde a suivi."
      : alive === 6 ? "Personne n'est mort. Même pas Pyrolâtre."
      : alive >= 4 ? "Quelques pertes, mais le raid tient debout."
      : "C'est un cimetière, mais un cimetière bien soigné.";
    const lines = [
      ["y", `Survivants : ${alive} / 6`],
      ["s", `Points de vie rendus : ${healed}`],
      tankDead ? ["d", "Le tank est mort. Il en parlera pendant des semaines."] : ["s", "Le tank est vivant. Il ne te remerciera pas, c'est normal."],
      party[1].dead ? ["muted", "Pyrolâtre est mort dans le feu. Ce n'est pas de ta faute. Dis-le lui quand même."] : ["s", "Tu as gardé en vie quelqu'un qui ne le méritait pas. Respect."],
    ];
    later(() => done({ bonus, headline, lines, summary: `Heal : ${alive}/6 survivants${tankDead ? " (tank mort)" : ""}` }), 900);
  }
}

Object.assign(TRIALS.heal, { run3d: healGame3D, rules3d: `Le groupe affronte ${BOSS_NAME} pendant 25 secondes. <b>Clique sur un cadre</b> à gauche, ou directement sur un personnage, pour le soigner (8 mana, touches <kbd>1</kbd> à <kbd>6</kbd>).
      Le <b>soin de groupe</b> coûte 25 mana (<kbd>Espace</kbd>). La mana se régénère lentement. Pyrolâtre reste dans le feu, évidemment.
      Quand le boss lève le bras, une grosse frappe arrive sur le tank.` });
Object.assign(TRIALS.tank, { run3d: tankGame3D, rules3d: `Pendant 25 secondes, des monstres déboulent des bords de l'arène vers Soignou, le healer. <b>Clique dessus</b> pour les provoquer : ils viennent sur toi.
      Les gros demandent deux provocations. <kbd>1</kbd> ou <kbd>Espace</kbd> provoque le monstre le plus proche du healer, avec 1 seconde de recharge.
      Chaque monstre qui atteint le healer lui retire des PV. S'il tombe à 0, c'est fini.` });
Object.assign(TRIALS.dps, { run3d: dpsGame3D, rules3d: `Pendant 25 secondes, enchaîne ta rotation : la technique à lancer est surlignée dans la barre d'action (touches <kbd>1</kbd> à <kbd>4</kbd>, sans Shift sur AZERTY, ou un clic).
      Déplace-toi avec <kbd>Z</kbd> <kbd>Q</kbd> <kbd>S</kbd> <kbd>D</kbd>, les flèches, ou en cliquant sur le sol. Reste dans l'anneau bleu, sinon tes attaques ne partent pas.
      Un cercle apparaît régulièrement sous tes pieds : sors-en avant qu'il s'embrase (1,4 seconde), et ne remarche pas dedans. Trois brûlures et tu meurs.` });

// Arrête les intervalles d'un jeu sans effacer le délai de fin qui suit.
// (clearInterval annule aussi un setTimeout de même id : on ne touche qu'aux vrais intervalles.)
function clearIntervalsOnly() { INTERVALS.forEach((id) => clearInterval(id)); INTERVALS.clear(); S.keyHandler = null; }

/* ============ ÉCRAN 5 : VERDICT ============ */
function screenVerdict() {
  setStep(TOTAL_STEPS, "Verdict");
  const st = S.stats;
  const main = S.trials[S.role];
  const trialBonus = main ? main.bonus : 0;
  const extra = Object.entries(S.trials).filter(([k]) => k !== S.role).reduce((a, [, r]) => a + Math.max(0, r.bonus) * 0.5, 0);
  const score = st.fia + st.skill + st.team - st.greed + trialBonus + (S.patience ? S.patience.bonus : 0) + extra;

  let stamp, cls, rank, comment;
  if (score >= 19) { stamp = "ACCEPTÉ"; cls = "ok"; rank = "Futur officier"; comment = "On ne va pas se mentir : tu es trop bien pour nous. On te prend quand même, avant qu'une autre guilde le fasse."; }
  else if (score >= 11) { stamp = "ACCEPTÉ"; cls = "ok"; rank = "Recrue prometteuse (période d'essai)"; comment = "Bon profil. On te garde à l'œil pendant deux semaines, puis on oublie de te passer membre pendant trois mois."; }
  else if (score >= 4) { stamp = "EN ATTENTE"; cls = "mid"; rank = "Remplaçant de banc"; comment = "Tu as du potentiel. Beaucoup de potentiel. Surtout du potentiel. Viens sur le Discord, on en reparle."; }
  else if (score >= -4) { stamp = "REFUSÉ"; cls = "no"; rank = "Mascotte honoraire"; comment = "Ce n'est pas un non définitif. C'est un non. Mais on a une guilde de rerolls qui recrute."; }
  else { stamp = "BANNI"; cls = "no"; rank = "Légende du Grand Livre de la Honte"; comment = "Ta candidature sera lue à voix haute à chaque réunion d'officiers. Merci pour ce moment."; }

  const traits = [
    ["greed", st.greed, "le Ninja"], ["skill", st.skill, "le Calculateur"],
    ["team", st.team, "l'Âme du Discord"], ["fia", st.fia, "l'Horloge Suisse"],
  ];
  let epithet = st.greed >= 3 ? "le Ninja" : traits.slice(1).sort((a, b) => b[1] - a[1])[0][2];
  if (st.fia <= -3) epithet = "l'Éternel Retardataire";

  const bar = (v, lo, hi) => clamp(Math.round(((v - lo) / (hi - lo)) * 10), 0, 10);
  const vals = { fia: bar(st.fia, -5, 7), skill: bar(st.skill, -5, 11), team: bar(st.team, -5, 11), greed: bar(st.greed, -3, 6) };

  const trialLines = Object.entries(S.trials).map(([k, r]) => `<div class="${k === S.role ? "y" : "muted"}">${esc(r.summary)}${k === S.role ? "" : " (bonus)"}</div>`).join("");
  if (!S.attempt) S.attempt = nextAttempt();
  const copy = [
    `Candidature – ${CONFIG.guild}`,
    S.attempt > 1 ? `Tentative n°${S.attempt} (le Conseil a tout vu)` : null,
    `Pseudo : ${S.name} (${S.cls}, ${ROLES[S.role].label})`,
    `Verdict : ${stamp} – ${rank}`,
    `Titre : ${S.name} ${epithet}`,
    `Fiabilité ${vals.fia}/10 · Skill ${vals.skill}/10 · Esprit d'équipe ${vals.team}/10 · Tendance ninja ${vals.greed}/10`,
    `Test du pull : ${S.patience ? S.patience.text : "non passé"}`,
    ...Object.values(S.trials).map((r) => r.summary),
    `Score secret du Conseil : ${Math.round(score * 10) / 10}`,
  ].filter(Boolean).join("\n");

  show(`
    <div class="verdict-head">
      <div class="eyebrow"><span>Délibération de ${esc(CONFIG.council)}</span></div>
      <div class="stamp ${cls}">${stamp}</div>
      <p class="rank">${esc(S.name)} <b>${esc(epithet)}</b> · ${esc(S.cls)} · ${ROLES[S.role].label}</p>
      <p class="rank">Rang attribué : <b>${esc(rank)}</b></p>
    </div>
    <blockquote class="quote">${esc(comment)}</blockquote>
    <p id="save-status" class="muted" style="margin:0" hidden></p>
    <div class="stats">
      ${[["fia", "Fiabilité"], ["skill", "Skill"], ["team", "Esprit d'équipe"], ["greed", "Tendance ninja"]].map(([k, l]) => `
        <div class="stat ${k}"><span>${l}</span><span class="bar"><i style="width:0" data-w="${vals[k] * 10}"></i></span><span>${vals[k]}/10</span></div>`).join("")}
    </div>
    <div class="log">
      <div class="y">Test du pull : ${esc(S.patience ? S.patience.text : "non passé")}</div>
      ${trialLines || `<div class="muted">Aucune épreuve de rôle.</div>`}
    </div>
    <hr class="sep">
    <h3>Résumé à envoyer</h3>
    <p class="muted" style="margin:0">Copie ce texte et ${esc(CONFIG.sendTo)}.</p>
    <textarea id="copy-text" readonly>${esc(copy)}</textarea>
    <div class="btn-row">
      <button class="btn" type="button" id="btn-copy">Copier le résumé</button>
      <button class="btn ghost" type="button" id="btn-again">Recommencer (on verra tout)</button>
    </div>
  `);
  requestAnimationFrame(() => stage.querySelectorAll(".stat .bar > i").forEach((i) => (i.style.width = i.dataset.w + "%")));
  $("#btn-copy").addEventListener("click", async () => {
    const b = $("#btn-copy"), ta = $("#copy-text");
    try { await navigator.clipboard.writeText(ta.value); b.textContent = "Copié !"; }
    catch { ta.focus(); ta.select(); b.textContent = "Texte sélectionné, fais Ctrl+C"; }
    setTimeout(() => (b.textContent = "Copier le résumé"), 2500);
  });
  $("#btn-again").addEventListener("click", screenIntro);

  if (S.saved) return;
  S.saved = true;
  const status = $("#save-status");
  saveAttempt({
    pseudo: S.name, classe: S.cls, role: S.role,
    verdict: stamp, rang: rank, titre: epithet,
    score: Math.round(score * 10) / 10, tentative: S.attempt,
    stats: { brut: st, sur10: vals },
    test_pull: S.patience,
    epreuves: Object.fromEntries(Object.entries(S.trials).map(([k, r]) => [k, { bonus: r.bonus, resume: r.summary, titre: r.headline }])),
    reponses: S.answers,
  }).then((r) => {
    if (r !== "ok") return;
    status.textContent = "Dossier transmis au Conseil. Il délibère (il regarde surtout ta Tendance ninja).";
    status.hidden = false;
  }).catch((err) => {
    console.error("Sauvegarde impossible :", err);
    S.saved = false;
    status.textContent = "Le pigeon voyageur s'est perdu : ton dossier n'a pas été enregistré. Envoie le résumé ci-dessous sur Discord.";
    status.className = "err";
    status.hidden = false;
  });
}

/* ============ DÉMARRAGE ============ */
$("#guild-name").textContent = CONFIG.guild;
document.title = "Épreuve des Recrues – " + CONFIG.guild;
screenIntro();
